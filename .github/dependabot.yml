version: 2

registries:
  nuget-bepinex:
    type: nuget-feed
    url: https://nuget.bepinex.dev/v3/index.json

updates:
  - package-ecosystem: "nuget"
    directories:
      - "/"
      - "/src"
    registries: "*"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
